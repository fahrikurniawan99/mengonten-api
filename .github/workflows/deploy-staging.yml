name: Deploy to VPS (Staging)

on:
  push:
    branches: [staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            # Ensure docker compose plugin is installed
            if ! docker compose version &> /dev/null; then
              apt-get update -qq && apt-get install -y -qq docker-compose-plugin
            fi

            # Clone or pull repo
            if [ ! -d /opt/mengonten-api/.git ]; then
              git clone -b staging https://github.com/${{ github.repository }} /opt/mengonten-api
            fi
            cd /opt/mengonten-api
            git fetch origin staging
            git reset --hard origin/staging

            # Create .env from secrets if not exists
            if [ ! -f .env ]; then
              cat > .env << ENVEOF
DB_HOST=postgres
DB_PORT=5432
DB_USER=postgres
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
DB_NAME=mengonten_db
DB_SSLMODE=disable
JWT_SECRET=${{ secrets.JWT_SECRET }}
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
GIN_MODE=release
PORT=8080
CORS_ORIGINS=https://api-mengonten.tiroe.io
ENVEOF
            fi

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for health check
            sleep 10

            # Verify
            docker compose ps