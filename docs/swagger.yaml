definitions:
  routes.AdminReviewRequest:
    properties:
      admin_notes:
        type: string
      refund_amount:
        type: number
      status:
        enum:
        - confirmed
        - rejected
        type: string
    required:
    - status
    type: object
  routes.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/routes.UserResponse'
    type: object
  routes.CreateBankAccountRequest:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      bank_name:
        type: string
      icon:
        type: string
    required:
    - account_name
    - account_number
    - bank_name
    type: object
  routes.CreatePlanRequest:
    properties:
      benefits:
        type: string
      description:
        type: string
      discount_percent:
        maximum: 100
        minimum: 0
        type: number
      duration_days:
        type: integer
      name:
        type: string
      price:
        type: number
      sort_order:
        type: integer
      type:
        type: string
    required:
    - benefits
    - duration_days
    - name
    - price
    - type
    type: object
  routes.CreateTransactionRequest:
    properties:
      bank_account_id:
        type: string
      subscription_plan_id:
        type: string
    required:
    - bank_account_id
    - subscription_plan_id
    type: object
  routes.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  routes.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  routes.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  routes.SubmitYouTubeRequest:
    properties:
      youtube_url:
        type: string
    required:
    - youtube_url
    type: object
  routes.UpdateBankAccountRequest:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      bank_name:
        type: string
      icon:
        type: string
      is_active:
        type: boolean
    type: object
  routes.UpdatePlanRequest:
    properties:
      benefits:
        type: string
      description:
        type: string
      discount_percent:
        maximum: 100
        minimum: 0
        type: number
      duration_days:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      sort_order:
        type: integer
      type:
        type: string
    type: object
  routes.UpdateRoleRequest:
    properties:
      role:
        enum:
        - admin
        - user
        type: string
    required:
    - role
    type: object
  routes.UpdateTransactionStatusRequest:
    properties:
      status:
        enum:
        - paid
        - expired
        - cancelled
        type: string
    required:
    - status
    type: object
  routes.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  routes.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  routes.YouTubeVideoResponse:
    properties:
      genre:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
      youtube_url:
        type: string
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
info:
  contact: {}
  description: API Documentation
  title: Mengonten API
  version: "1.0"
paths:
  /api/admin/bank-accounts:
    get:
      description: List semua bank accounts - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Bank accounts list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all bank accounts (admin)
      tags:
      - Bank Account
    post:
      consumes:
      - application/json
      description: Tambah rekening bank baru - admin only
      parameters:
      - description: Bank account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreateBankAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Bank account created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create bank account (admin)
      tags:
      - Bank Account
  /api/admin/bank-accounts/{account_id}:
    delete:
      description: Hapus rekening bank - admin only
      parameters:
      - description: Account ID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bank account deleted
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete bank account (admin)
      tags:
      - Bank Account
    put:
      consumes:
      - application/json
      description: Update rekening bank - admin only
      parameters:
      - description: Account ID
        in: path
        name: account_id
        required: true
        type: string
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateBankAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Bank account updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update bank account (admin)
      tags:
      - Bank Account
  /api/admin/payment-proofs:
    get:
      description: List semua bukti transfer - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Payment proofs list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all payment proofs (admin)
      tags:
      - Admin Payment Proof
  /api/admin/payment-proofs/{proof_id}:
    get:
      description: Detail bukti transfer - admin only
      parameters:
      - description: Payment Proof ID
        in: path
        name: proof_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment proof detail
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get payment proof detail (admin)
      tags:
      - Admin Payment Proof
  /api/admin/payment-proofs/{proof_id}/confirm-overpaid:
    put:
      consumes:
      - multipart/form-data
      description: Konfirmasi bukti transfer dengan nominal kelebihan + upload bukti
        refund
      parameters:
      - description: Payment Proof ID
        in: path
        name: proof_id
        required: true
        type: string
      - description: Catatan admin
        in: formData
        name: admin_notes
        required: true
        type: string
      - description: Jumlah refund
        in: formData
        name: refund_amount
        required: true
        type: number
      - description: Bukti pengembalian dana
        in: formData
        name: refund_proof
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Overpaid confirmed
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Confirm overpaid payment proof (admin)
      tags:
      - Admin Payment Proof
  /api/admin/payment-proofs/{proof_id}/review:
    put:
      consumes:
      - application/json
      description: Konfirmasi atau tolak bukti transfer
      parameters:
      - description: Payment Proof ID
        in: path
        name: proof_id
        required: true
        type: string
      - description: Review result
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.AdminReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Review result
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Confirm or reject payment proof (admin)
      tags:
      - Admin Payment Proof
  /api/admin/subscription-plans:
    get:
      description: List semua subscription plans - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Plans list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all subscription plans (admin)
      tags:
      - Subscription Plan
    post:
      consumes:
      - application/json
      description: Tambah plan baru - admin only
      parameters:
      - description: Plan data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Plan created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create subscription plan (admin)
      tags:
      - Subscription Plan
  /api/admin/subscription-plans/{plan_id}:
    delete:
      description: Hapus plan - admin only
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plan deleted
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete subscription plan (admin)
      tags:
      - Subscription Plan
    put:
      consumes:
      - application/json
      description: Update plan - admin only
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Plan updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update subscription plan (admin)
      tags:
      - Subscription Plan
  /api/admin/transactions:
    get:
      description: List semua transaksi - admin only
      produces:
      - application/json
      responses:
        "200":
          description: All transactions
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all transactions (admin)
      tags:
      - Admin Transaction
  /api/admin/transactions/{transaction_id}/status:
    put:
      consumes:
      - application/json
      description: Update status transaksi - admin only. Jika paid, otomatis buat
        subscription
      parameters:
      - description: Transaction ID
        in: path
        name: transaction_id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateTransactionStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Transaction updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update transaction status (admin)
      tags:
      - Admin Transaction
  /api/admin/users:
    get:
      description: List semua users - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Users list
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all users (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}:
    delete:
      description: Hapus user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete user (admin)
      tags:
      - Admin
    get:
      description: Get detail user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User detail
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get user by ID (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/role:
    put:
      consumes:
      - application/json
      description: Ubah role user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update user role (admin)
      tags:
      - Admin
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.AuthResponse'
              type: object
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: User login
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Logout user (clears session)
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/utils.Response'
      summary: User logout
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create new user account with email, username, and password
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.AuthResponse'
              type: object
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Register new user
      tags:
      - Auth
  /api/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Kirim ulang email verifikasi (cooldown 5 menit)
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification email sent
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
        "429":
          description: Rate limited - cooldown active
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Resend verification email
      tags:
      - Auth
  /api/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verify user email dengan token dari email
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Verify email address
      tags:
      - Auth
  /api/bank-accounts:
    get:
      description: List bank accounts yang aktif untuk user
      produces:
      - application/json
      responses:
        "200":
          description: Active bank accounts
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get active bank accounts (public)
      tags:
      - Bank Account
  /api/profile:
    get:
      description: Retrieve authenticated user profile information
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.UserResponse'
              type: object
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get user profile
      tags:
      - Auth
  /api/subscription-plans:
    get:
      description: List plans yang aktif untuk user
      produces:
      - application/json
      responses:
        "200":
          description: Active plans
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get active subscription plans (public)
      tags:
      - Subscription Plan
  /api/subscription/check:
    get:
      description: Cek apakah user masih punya langganan aktif
      produces:
      - application/json
      responses:
        "200":
          description: Subscription status
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Check active subscription
      tags:
      - Subscription
  /api/subscription/history:
    get:
      description: History langganan yang sudah di-order user
      produces:
      - application/json
      responses:
        "200":
          description: Subscription history
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get subscription history
      tags:
      - Subscription
  /api/transactions:
    get:
      description: List transaksi milik user sendiri
      produces:
      - application/json
      responses:
        "200":
          description: My transactions
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get my transactions (user)
      tags:
      - Transaction
    post:
      consumes:
      - application/json
      description: Buat transaksi baru untuk langganan
      parameters:
      - description: Transaction data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Transaction created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create transaction (user)
      tags:
      - Transaction
  /api/transactions/{transaction_id}/payment-proof:
    get:
      description: Lihat bukti transfer milik user sendiri
      parameters:
      - description: Transaction ID
        in: path
        name: transaction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment proof
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get my payment proof (user)
      tags:
      - Payment Proof
    post:
      consumes:
      - multipart/form-data
      description: Upload foto bukti transfer (max 5) + info transfer
      parameters:
      - description: Transaction ID
        in: path
        name: transaction_id
        required: true
        type: string
      - description: Atas nama rekening
        in: formData
        name: account_name
        required: true
        type: string
      - description: Transfer dari bank
        in: formData
        name: source_bank
        required: true
        type: string
      - description: Nomor rekening pengirim
        in: formData
        name: source_account_number
        type: string
      - collectionFormat: csv
        description: Foto bukti transfer (max 5)
        in: formData
        items:
          type: file
        name: photos
        required: true
        type: array
      - collectionFormat: csv
        description: Deskripsi per foto
        in: formData
        items:
          type: string
        name: descriptions
        required: true
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Payment proof uploaded
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Upload bukti transfer (user)
      tags:
      - Payment Proof
  /api/youtube/{video_id}:
    get:
      description: Get YouTube video info dan list generated clips
      parameters:
      - description: Video ID
        in: path
        name: video_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Video details
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get video details dan segments
      tags:
      - YouTube
  /api/youtube/jobs/{job_id}:
    get:
      description: Check status processing YouTube video
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Job status
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get processing job status
      tags:
      - YouTube
  /api/youtube/segments/{segment_id}:
    delete:
      description: Delete segment dari database dan Cloudinary
      parameters:
      - description: Segment ID
        in: path
        name: segment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Segment deleted
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Segment not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete video segment/clip
      tags:
      - YouTube
  /api/youtube/submit:
    post:
      consumes:
      - application/json
      description: Submit YouTube URL untuk di-download, analyze, dan auto-clip
      parameters:
      - description: YouTube URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.SubmitYouTubeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Video submitted
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.YouTubeVideoResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Submit YouTube video untuk auto-clipping
      tags:
      - YouTube
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
