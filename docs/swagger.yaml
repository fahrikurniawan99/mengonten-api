definitions:
  routes.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/routes.UserResponse'
    type: object
  routes.CreatePlanRequest:
    properties:
      benefits:
        type: string
      description:
        type: string
      discount_percent:
        maximum: 100
        minimum: 0
        type: number
      duration_days:
        type: integer
      final_price:
        minimum: 0
        type: number
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      type:
        type: string
    required:
    - benefits
    - duration_days
    - name
    - type
    type: object
  routes.CreateRuleRequest:
    properties:
      description:
        type: string
      rule_key:
        type: string
      rule_value:
        type: string
    required:
    - rule_key
    - rule_value
    type: object
  routes.CreateSceneRequest:
    properties:
      youtube_url:
        type: string
    required:
    - youtube_url
    type: object
  routes.CreateTransactionRequest:
    properties:
      payment_method:
        type: string
      subscription_plan_id:
        type: string
    required:
    - payment_method
    - subscription_plan_id
    type: object
  routes.LoginRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  routes.RegisterRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  routes.ReorderPlanItem:
    properties:
      id:
        type: string
      sort_order:
        type: integer
    required:
    - id
    - sort_order
    type: object
  routes.ReorderPlansRequest:
    properties:
      plans:
        items:
          $ref: '#/definitions/routes.ReorderPlanItem'
        minItems: 1
        type: array
    required:
    - plans
    type: object
  routes.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  routes.SubmitYouTubeRequest:
    properties:
      youtube_url:
        type: string
    required:
    - youtube_url
    type: object
  routes.SuspendRequest:
    properties:
      expires_at:
        type: string
      reason:
        type: string
    required:
    - reason
    type: object
  routes.UpdatePlanRequest:
    properties:
      benefits:
        type: string
      description:
        type: string
      discount_percent:
        maximum: 100
        minimum: 0
        type: number
      duration_days:
        type: integer
      final_price:
        type: number
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      type:
        type: string
    type: object
  routes.UpdateRoleRequest:
    properties:
      role:
        enum:
        - admin
        - user
        type: string
    required:
    - role
    type: object
  routes.UpdateRuleRequest:
    properties:
      description:
        type: string
      rule_value:
        type: string
    type: object
  routes.UpdateTransactionStatusRequest:
    properties:
      status:
        enum:
        - success
        - failed
        - cancel
        type: string
    required:
    - status
    type: object
  routes.UserResponse:
    properties:
      account_status:
        type: string
      email:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      role:
        type: string
      warning_message:
        type: string
    type: object
  routes.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  routes.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  routes.WarnRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  routes.YouTubeVideoResponse:
    properties:
      genre:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
      youtube_url:
        type: string
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
info:
  contact: {}
  description: API Documentation
  title: Mengonten API
  version: "1.0"
paths:
  /api/admin/bank-accounts:
    get:
      description: List semua bank accounts - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Bank accounts list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all bank accounts (admin)
      tags:
      - Bank Account
    post:
      consumes:
      - multipart/form-data
      description: Tambah rekening bank baru + upload icon - admin only
      parameters:
      - description: Nama bank
        in: formData
        name: bank_name
        required: true
        type: string
      - description: Nomor rekening
        in: formData
        name: account_number
        required: true
        type: string
      - description: Atas nama
        in: formData
        name: account_name
        required: true
        type: string
      - description: Icon bank
        in: formData
        name: icon
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Bank account created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create bank account (admin)
      tags:
      - Bank Account
  /api/admin/bank-accounts/{account_id}:
    delete:
      description: Hapus rekening bank + icon - admin only
      parameters:
      - description: Account ID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bank account deleted
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete bank account (admin)
      tags:
      - Bank Account
    put:
      consumes:
      - multipart/form-data
      description: Update rekening bank + ganti icon - admin only
      parameters:
      - description: Account ID
        in: path
        name: account_id
        required: true
        type: string
      - description: Nama bank
        in: formData
        name: bank_name
        type: string
      - description: Nomor rekening
        in: formData
        name: account_number
        type: string
      - description: Atas nama
        in: formData
        name: account_name
        type: string
      - description: Icon bank (ganti)
        in: formData
        name: icon
        type: file
      - description: Aktif/nonaktif (true/false)
        in: formData
        name: is_active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bank account updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update bank account (admin)
      tags:
      - Bank Account
  /api/admin/rules/{rule_id}:
    delete:
      description: Hapus rule dari subscription plan
      parameters:
      - description: Rule ID
        in: path
        name: rule_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Rule deleted
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete rule (admin)
      tags:
      - Subscription Rule
    put:
      consumes:
      - application/json
      description: Update rule value dan description
      parameters:
      - description: Rule ID
        in: path
        name: rule_id
        required: true
        type: string
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Rule updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update rule (admin)
      tags:
      - Subscription Rule
  /api/admin/subscription-plans:
    get:
      description: List semua subscription plans - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Plans list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all subscription plans (admin)
      tags:
      - Subscription Plan
    post:
      consumes:
      - application/json
      description: Tambah plan baru - admin only
      parameters:
      - description: Plan data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Plan created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create subscription plan (admin)
      tags:
      - Subscription Plan
  /api/admin/subscription-plans/{plan_id}:
    delete:
      description: Hapus plan - admin only
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plan deleted
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete subscription plan (admin)
      tags:
      - Subscription Plan
    put:
      consumes:
      - application/json
      description: Update plan - admin only
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Plan updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update subscription plan (admin)
      tags:
      - Subscription Plan
  /api/admin/subscription-plans/{plan_id}/rules:
    get:
      description: List semua rules untuk subscription plan tertentu
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Rules list
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get rules for a plan (admin)
      tags:
      - Subscription Rule
    post:
      consumes:
      - application/json
      description: Tambah rule baru ke subscription plan
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Rule data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreateRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Rule created
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Rule key already exists
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Create rule for a plan (admin)
      tags:
      - Subscription Rule
  /api/admin/subscription-plans/reorder:
    put:
      consumes:
      - application/json
      description: Ubah urutan plans - admin only
      parameters:
      - description: Reorder data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.ReorderPlansRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Plans reordered
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Reorder subscription plans (admin)
      tags:
      - Subscription Plan
  /api/admin/transactions:
    get:
      description: List semua transaksi - admin only
      produces:
      - application/json
      responses:
        "200":
          description: All transactions
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all transactions (admin)
      tags:
      - Admin Transaction
  /api/admin/transactions/{transaction_id}/status:
    put:
      consumes:
      - application/json
      description: Update status transaksi - admin only
      parameters:
      - description: Transaction ID
        in: path
        name: transaction_id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateTransactionStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Transaction updated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update transaction status (admin)
      tags:
      - Admin Transaction
  /api/admin/users:
    get:
      description: List semua users - admin only
      produces:
      - application/json
      responses:
        "200":
          description: Users list
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get all users (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}:
    delete:
      description: Hapus user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Delete user (admin)
      tags:
      - Admin
    get:
      description: Get detail user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User detail
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get user by ID (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/deactivate:
    put:
      description: Nonaktifkan akun user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deactivated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Deactivate user (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/reactivate:
    put:
      description: Aktifkan kembali akun user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User reactivated
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Reactivate user (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/role:
    put:
      consumes:
      - application/json
      description: Ubah role user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Update user role (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/suspend:
    put:
      consumes:
      - application/json
      description: Tangguhkan akun user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Suspend data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.SuspendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User suspended
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Suspend user (admin)
      tags:
      - Admin
  /api/admin/users/{user_id}/warn:
    put:
      consumes:
      - application/json
      description: Kirim peringatan ke user - admin only
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Warning message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.WarnRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Warning sent
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Warn user (admin)
      tags:
      - Admin
  /api/admin/videos:
    get:
      description: List semua video dari semua user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Search by title/genre
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Video list with pagination
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: List all videos (admin)
      tags:
      - Admin
  /api/auth/admin/login:
    post:
      consumes:
      - application/json
      description: Kirim kode OTP ke email admin untuk login
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Admin login (send OTP)
      tags:
      - Auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Kirim kode OTP ke email untuk login
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent
          schema:
            $ref: '#/definitions/utils.Response'
      summary: User login (send OTP)
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Logout user
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/utils.Response'
      summary: User logout
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Daftar dengan email, kirim verifikasi email
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registration email sent
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Register new user
      tags:
      - Auth
  /api/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Kirim ulang email verifikasi
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification email sent
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Resend verification email
      tags:
      - Auth
  /api/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifikasi email dan auto-login
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.AuthResponse'
              type: object
      summary: Verify email address
      tags:
      - Auth
  /api/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Masukkan kode OTP untuk login
      parameters:
      - description: Email & OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.AuthResponse'
              type: object
      summary: Verify OTP
      tags:
      - Auth
  /api/bank-accounts:
    get:
      description: List bank accounts yang aktif untuk user
      produces:
      - application/json
      responses:
        "200":
          description: Active bank accounts
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get active bank accounts (public)
      tags:
      - Bank Account
  /api/orders:
    get:
      description: List semua order/langganan milik user
      produces:
      - application/json
      responses:
        "200":
          description: My orders
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Get my orders (user)
      tags:
      - Order
  /api/orders/subscription:
    get:
      description: Cek langganan aktif + rules + usage
      produces:
      - application/json
      responses:
        "200":
          description: Subscription status
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - Bearer: []
      summary: Check active subscription
      tags:
      - Order
  /api/profile:
    get:
      description: Ambil profil user yang sedang login
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/routes.UserResponse'
              type: object
      security:
      - Bearer: []
      summary: Get user profile
      tags:
      - Auth
  /api/subscription-plans:
    get:
      description: List plans yang aktif untuk user
      produces:
      - application/json
      responses:
        "200":
          description: Active plans
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get active subscription plans (public)
      tags:
      - Subscription Plan
  /api/subscription-plans/{plan_id}:
    get:
      description: Detail subscription plan
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plan detail
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get subscription plan by ID (public)
      tags:
      - Subscription Plan
  /api/transactions:
    get:
      description: List transaksi milik user sendiri
      produces:
      - application/json
      responses:
        "200":
          description: My transactions
          schema:
            $ref: '#/definitions/utils.Response'
